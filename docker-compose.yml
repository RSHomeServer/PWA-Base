services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLATFORM_APP_VERSION: ${PLATFORM_APP_VERSION:-}
        PLATFORM_RUNTIME_MODE: ${PLATFORM_RUNTIME_MODE:-development}
    container_name: website-hosting-platform
    networks:
      - workspace_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.platform.rule=Host(`apps.songara.uk`)"
      - "traefik.http.routers.platform.entrypoints=https"
      - "traefik.http.routers.platform.tls.certresolver=cloudflare"
      - "traefik.http.services.platform.loadbalancer.server.port=80"
      - "traefik.http.routers.platform.middlewares=crowdsec@docker"

  telemetry:
    build:
      context: .
      dockerfile: apps/telemetry/Dockerfile
    container_name: website-hosting-telemetry
    environment:
      TELEMETRY_HOST: "0.0.0.0"
      TELEMETRY_PORT: "4310"
      TELEMETRY_DB: "/data/telemetry.sqlite"
      TELEMETRY_ARTIFACTS: "/data/run-artifacts"
    volumes:
      - telemetry_data:/data
    ports:
      - "4310:4310"
    networks:
      - workspace_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4310/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  dashboard-web:
    build:
      context: .
      dockerfile: apps/dashboard-web/Dockerfile
      args:
        PLATFORM_APP_VERSION: ${PLATFORM_APP_VERSION:-}
        PLATFORM_RUNTIME_MODE: ${PLATFORM_RUNTIME_MODE:-development}
    container_name: website-hosting-dashboard-web
    networks:
      - workspace_network
    depends_on:
      - telemetry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-web.rule=Host(`dashboard.songara.uk`)"
      - "traefik.http.routers.dashboard-web.entrypoints=https"
      - "traefik.http.routers.dashboard-web.tls.certresolver=cloudflare"
      - "traefik.http.services.dashboard-web.loadbalancer.server.port=80"
      - "traefik.http.routers.dashboard-web.middlewares=crowdsec@docker"

networks:
  workspace_network:
    external: true

volumes:
  telemetry_data:
