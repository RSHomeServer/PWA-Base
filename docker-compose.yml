# Reference app only (hello-web). Product Traefik / *.songara.uk labels removed in T0.5.
# Prefer `pnpm dev` for day-to-day work; Compose is optional for image smoke tests.

services:
  hello-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLATFORM_APP_VERSION: ${PLATFORM_APP_VERSION:-}
        PLATFORM_RUNTIME_MODE: ${PLATFORM_RUNTIME_MODE:-development}
    container_name: pwa-base-hello-web
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
