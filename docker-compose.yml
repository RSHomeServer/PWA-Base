services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLATFORM_APP_VERSION: ${PLATFORM_APP_VERSION:-}
        PLATFORM_RUNTIME_MODE: ${PLATFORM_RUNTIME_MODE:-development}
    container_name: website-hosting-platform
    networks:
      - workspace_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.platform.rule=Host(`apps.songara.uk`)"
      - "traefik.http.routers.platform.entrypoints=https"
      - "traefik.http.routers.platform.tls.certresolver=cloudflare"
      - "traefik.http.services.platform.loadbalancer.server.port=80"
      - "traefik.http.routers.platform.middlewares=crowdsec@docker"

  telemetry:
    build:
      context: .
      dockerfile: apps/telemetry/Dockerfile
    container_name: website-hosting-telemetry
    environment:
      TELEMETRY_HOST: "0.0.0.0"
      TELEMETRY_PORT: "4310"
      TELEMETRY_DB: "/data/telemetry.sqlite"
      TELEMETRY_ARTIFACTS: "/data/run-artifacts"
    volumes:
      - telemetry_data:/data
    ports:
      - "4310:4310"
    networks:
      - workspace_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4310/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  docs-api:
    build:
      context: .
      dockerfile: apps/docs-api/Dockerfile
    container_name: website-hosting-docs-api
    environment:
      DOCS_API_HOST: "0.0.0.0"
      DOCS_API_PORT: "4320"
      DOCS_API_WORKSPACE: "/app"
      DOCS_API_CONFIG: "/app/config/docs-explorer.roots.json"
    volumes:
      - ./docs:/app/docs:ro
      - ./packages:/app/packages:ro
      - ./config/docs-explorer.roots.json:/app/config/docs-explorer.roots.json:ro
      - ./README.md:/app/README.md:ro
      - ./CURSOR.md:/app/CURSOR.md:ro
      - ./CONTRIBUTING.md:/app/CONTRIBUTING.md:ro
    ports:
      - "4320:4320"
    networks:
      - workspace_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4320/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  docs-web:
    build:
      context: .
      dockerfile: apps/docs-web/Dockerfile
      args:
        PLATFORM_APP_VERSION: ${PLATFORM_APP_VERSION:-}
        PLATFORM_RUNTIME_MODE: ${PLATFORM_RUNTIME_MODE:-development}
    container_name: website-hosting-docs-web
    networks:
      - workspace_network
    depends_on:
      - docs-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs-web.rule=Host(`docs.songara.uk`)"
      - "traefik.http.routers.docs-web.entrypoints=https"
      - "traefik.http.routers.docs-web.tls.certresolver=cloudflare"
      - "traefik.http.services.docs-web.loadbalancer.server.port=80"
      - "traefik.http.routers.docs-web.middlewares=crowdsec@docker"

  dashboard-web:
    build:
      context: .
      dockerfile: apps/dashboard-web/Dockerfile
      args:
        PLATFORM_APP_VERSION: ${PLATFORM_APP_VERSION:-}
        PLATFORM_RUNTIME_MODE: ${PLATFORM_RUNTIME_MODE:-development}
    container_name: website-hosting-dashboard-web
    networks:
      - workspace_network
    depends_on:
      - telemetry
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-web.rule=Host(`dashboard.songara.uk`)"
      - "traefik.http.routers.dashboard-web.entrypoints=https"
      - "traefik.http.routers.dashboard-web.tls.certresolver=cloudflare"
      - "traefik.http.services.dashboard-web.loadbalancer.server.port=80"
      - "traefik.http.routers.dashboard-web.middlewares=crowdsec@docker"

networks:
  workspace_network:
    external: true

volumes:
  telemetry_data:
